<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wachtplanning MKA</title><meta name="robots" content="noindex">
<style>
:root{--g:#1E8E4E;--gb:#DDF3E4;--o:#C76A00;--ob:#FFE6C2;--r:#C62828;--rb:#F9D3D3;--ink:#1B2430;--mut:#5B6675;--line:#E1E5EA;--kop:#1F3A5F;--sp:#F6C343;--zo:#FFF3B0;--vak:#D6EAF8;--feest:#7B4BB7;--bg:#F4F6F8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px 8px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wie{font-weight:700;font-size:16px}.wie small{font-weight:400;color:var(--mut)}
.badge{display:inline-block;min-width:34px;text-align:center;padding:2px 6px;border-radius:6px;font-weight:700;font-size:13px}
#status{font-size:13px;font-weight:600;white-space:nowrap;padding:4px 10px;border-radius:14px;background:var(--gb);color:var(--g)}
#status.bezig{background:var(--ob);color:var(--o)}#status.fout{background:var(--rb);color:var(--r)}
#traag{display:none;background:#FFF4E0;border:1px solid #F0C27A;color:#7A4A00;border-radius:10px;padding:7px 10px;margin-top:8px;font-size:13px;font-weight:600}
.laden{margin-top:40px;text-align:center;padding:24px 16px}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--kop);border-radius:50%;margin:0 auto 14px;animation:draai .9s linear infinite}
@keyframes draai{to{transform:rotate(360deg)}}
.laden .na{display:none;color:var(--mut);margin-top:10px;font-size:14px}
.knop{margin-top:14px;font-size:16px;padding:11px 18px;border:none;border-radius:10px;background:var(--kop);color:#fff;font-weight:600}
.penseel{display:flex;gap:6px;margin-top:8px}
.penseel button{flex:1;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:14px;font-weight:600;color:var(--ink)}
.penseel button.actief{border-color:var(--kop);box-shadow:0 0 0 2px var(--kop) inset}
.penseel .g{background:var(--gb)}.penseel .p{background:#1E8E4E;color:#fff}.penseel button{font-size:13px;padding:8px 2px}.dag.p{background:#1E8E4E;color:#fff}.dag.p .l,.dag.p .n{color:#fff}.dag.p .s{color:#fff;font-weight:700}.week.st-p{border-left-color:#0B5A2C;background:#F2FBF5}.chip.gr{background:#1E8E4E;color:#fff}.tipgr{flex-basis:100%;font-size:13px;color:var(--mut);margin-top:4px}.penseel .o{background:var(--ob)}.penseel .r{background:var(--rb)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.voorl{margin-top:6px;padding:7px 9px;border-radius:8px;background:#FFF4D6;border:1px solid #F0C36D;color:#6B4E00}.tabs button{flex:1 1 28%;min-width:0;padding:7px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--mut)}
.tabs button.actief{background:var(--kop);color:#fff;border-color:var(--kop);font-weight:600}
main{padding:10px 10px 170px;max-width:760px;margin:0 auto}
header>*,footer>*{max-width:740px;margin-left:auto;margin-right:auto}
.blok{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.blok b{color:var(--kop)}
.uitleg summary{cursor:pointer;font-weight:600;color:var(--kop)}
.uitleg ul{margin:6px 0 0;padding-left:18px;color:var(--mut)}
.schakel{display:flex;align-items:center;justify-content:space-between;gap:10px}
.schakel select{font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--line)}
.maand{margin:16px 2px 6px;font-weight:700;color:var(--kop);text-transform:capitalize}
.week{background:#fff;border:1px solid var(--line);border-left:6px solid var(--g);border-radius:12px;padding:8px 8px 10px;margin-bottom:8px}
.week.st-o{border-left-color:#F0A030}.week.st-r{border-left-color:var(--r)}.week.sp{background:#FFFBEA}
.wkop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.wknr{border:1px solid var(--kop);background:#fff;color:var(--kop);font-weight:700;border-radius:8px;padding:5px 8px;font-size:14px}
.tijd{font-size:12px;color:var(--mut)}
.chip{font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600}
.chip.sp{background:var(--sp);color:#5A4300}.chip.zo{background:var(--zo);color:#6B5A00}.chip.tel{background:#EEF1F5;color:var(--mut);margin-left:auto}
.chip.tel.krap{background:#FDE2E2;color:var(--r)}
.dagen{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:4px}
.dag{border:1px solid var(--line);border-radius:9px;padding:4px 0 3px;text-align:center;background:var(--gb);min-height:52px;position:relative;cursor:pointer;user-select:none}
.dag .l{font-size:11px;color:var(--mut)}.dag .n{font-size:15px;font-weight:700}.dag .s{font-size:12px;font-weight:700;color:var(--g)}
.dag.we .l{font-weight:700;color:var(--ink)}
.dag.v{box-shadow:inset 0 -4px 0 #8EC5EC}
.dag.f::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--feest)}
.dag.o{background:var(--ob)}.dag.o .s{color:var(--o)}.dag.r{background:var(--rb)}.dag.r .s{color:var(--r)}
.opm{margin-top:6px;display:flex;gap:6px;align-items:center}
.opm button{border:none;background:none;font-size:13px;color:var(--kop);padding:2px 0}
.opm input{flex:1;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.feestnaam{font-size:11px;color:var(--feest);margin-top:4px}
.apart{background:#ECEEF1;border:1px dashed #B8BEC6;border-radius:12px;padding:10px;margin-bottom:8px;color:var(--mut);font-size:13px}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));font-size:13px;z-index:5}
footer .w{color:var(--r);font-weight:600;margin-top:3px}
.mw .kaart{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.mw .kaart.vraag{border-left:6px solid #F0A030;background:#FFFBF2}.mw .kaart.uit{border-left:6px solid var(--kop)}
.mw .t{font-weight:700;color:var(--kop)}.mw .sub{font-size:12.5px;color:var(--mut)}
.mw .knoppen{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.mw button.k{border:1px solid var(--kop);background:#fff;color:var(--kop);border-radius:9px;padding:7px 10px;font-size:13.5px;font-weight:600}
.mw button.k.hoofd{background:var(--kop);color:#fff}.mw button.k.nee{border-color:var(--r);color:var(--r)}
.mw button.k:disabled{opacity:.5}
.mw .lijst label{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-top:1px solid var(--line);font-size:14px}
.mw .lijst label.uit{opacity:.55}
.mw .w8{color:#9A5B00;font-size:12px;display:block}.mw .bol{width:12px;height:12px;border-radius:50%;display:inline-block;margin-top:4px;flex:0 0 12px}
.mw h3{font-size:15px;color:var(--kop);margin:14px 2px 6px}
.mw .melding{background:var(--gb);color:var(--g);font-weight:700;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.mw .fout{background:var(--rb);color:var(--r)}
.mw textarea{width:100%;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:7px;margin-top:6px}
.klaarknop{display:block;width:100%;margin-top:7px;padding:12px;font-size:16px;font-weight:700;border:none;border-radius:10px;background:var(--g);color:#fff}
.klaarok{margin-top:6px;color:var(--g);font-weight:700}
.dl{margin-top:4px;font-weight:600;color:var(--kop)}.dl.voorbij{color:var(--o)}
.slot{background:#ECEEF1;border:1px solid #B8BEC6;border-radius:10px;padding:8px 10px;margin-top:6px;color:#333;font-weight:600}
main.vast .dag,main.vast .wknr{cursor:default;opacity:.85}
.leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:12px;color:var(--mut)}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--c)}
</style></head><body>
<header>
  <div class="top"><div class="wie" id="wie"></div><div id="status">✓ alles bewaard</div></div>
  <div class="penseel" role="radiogroup" aria-label="Penseel">
    <button class="p" data-v="P">♥ Graag</button><button class="g" data-v="G">✓ Ja ik kan</button><button class="o" data-v="O">~ Liever niet</button><button class="r actief" data-v="R">✕ Absoluut niet</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="traag">⏳ Bewaren duurt even (kan tot 30 sec. duren). Je mag verder aanduiden; sluit de pagina nog niet.</div>
</header>
<main id="main"></main>
<footer id="voet"></footer>
<script>
var D = null;
var penseel = 'R', jaarIdx = 0, wijz = {}, opmW = {}, tweeW = null, timer = null, bezig = false;
var gmaxW = null; function gmaxNu(nr){ return (gmaxW && gmaxW.nr===nr) ? gmaxW.n : Number((D.graagMax||{})[nr]||0); }
var MAAND = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
var SYM = {G:'✓', O:'~', R:'✕', P:'♥'};
function el(t, c, txt){ var e=document.createElement(t); if(c) e.className=c; if(txt!=null) e.textContent=txt; return e; }
function v(d){ return D.voorkeur[d] || 'G'; }
function weekStatus(w){ var s='G'; w.dagen.forEach(function(x){ var y=v(x.d); if(y==='R') s='R'; else if(y==='O' && s!=='R') s='O'; else if(y==='P' && s==='G') s='P'; }); return s; }

function heeftVast(){ return D.jaren.some(function(j){ return j.vast; }); }
function kop(){
  var wie = document.getElementById('wie'); wie.textContent='';
  var b = el('span','badge',D.initialen); b.style.background = D.kleur || '#ddd';
  wie.appendChild(b); wie.appendChild(document.createTextNode(' ' + D.naam + ' '));
  var t = document.getElementById('tabs'); t.textContent='';
  if (heeftVast()){
    var mb = el('button', jaarIdx===-1?'actief':'', '📋 Mijn wachten');
    mb.onclick = function(){ jaarIdx=-1; kop(); teken(); window.scrollTo(0,0); };
    t.appendChild(mb);
  }
  D.jaren.forEach(function(j, i){
    var bt = el('button', i===jaarIdx?'actief':'', (j.vast ? '🔒 ' : j.voorlopig ? '⏳ ' : '✏️ ') + 'Wachtjaar ' + j.nr);
    bt.onclick = function(){ jaarIdx=i; kop(); teken(); window.scrollTo(0,0); };
    t.appendChild(bt);
  });
}

function teken(){
  var m = document.getElementById('main'); m.textContent='';
  if (jaarIdx === -1){ tekenMijn(); return; }
  var j = D.jaren[jaarIdx];
  var info = el('div','blok');
  info.innerHTML = '<b>Wachtjaar ' + j.nr + '</b> · ' + j.van + ' – ' + j.tot + ' · ' + j.n + ' stafleden' +
    (j.voorlopig ? '<div class="voorl">⏳ <b>Ligt nog niet vast</b> – je kunt al wel je voorkeuren aanduiden. De data kunnen nog wijzigen.</div>' : '');
  if (j.vast) info.innerHTML += '<div class="slot">🔒 Deze planning ligt vast – je kunt enkel nog kijken. Je definitieve wachten kreeg je per mail.</div>';
  else if (j.deadline) info.innerHTML += j.voorbij
    ? '<div class="dl voorbij">⏰ Deadline voorbij (' + j.deadline + ') – wijzigingen tellen enkel nog zolang de planning niet vastligt.</div>'
    : '<div class="dl">📅 Invullen tot ' + j.deadline + '</div>';
  m.className = j.vast ? 'vast' : '';
  var pz = document.querySelector('.penseel'); if (pz) pz.style.display = j.vast ? 'none' : '';
  m.appendChild(info);
  var u = el('details','blok uitleg'); u.innerHTML = '<summary>Hoe werkt het? (30 sec.)</summary><ul>' +
    '<li>Alles staat standaard op <b>✓ Ja ik kan</b>. Duid enkel aan wat niet of liever niet lukt.</li>' +
    '<li>Kies bovenaan een kleur en <b>tik op een dag</b>. Tik op het <b>weeknummer</b> om de hele week te kleuren.</li>' +
    '<li><b>♥ Graag</b> = weken die je graag doet. Kies daaronder hoeveel van je wachten de tool erin mag leggen. Het blijft eerlijk: je doet altijd evenveel wachten.</li>' +
    '<li>Eén ✕-dag betekent dat je die <b>hele week</b> geen wacht krijgt. Een ~-dag maakt de week "liever niet".</li>' +
    '<li>Alles wordt <b>automatisch bewaard</b>. 💬 = korte opmerking bij een week.</li>' +
    '<li>⭐ speciale week · ☀ zomer · paarse stip = feestdag · blauwe streep = schoolvakantie · 👥 = hoeveel collega\'s die week kunnen (zonder namen).</li></ul>' +
    '<div class="leg"><span style="--c:#1E8E4E">graag</span><span style="--c:#DDF3E4">ja ik kan</span><span style="--c:#FFE6C2">liever niet</span><span style="--c:#F9D3D3">absoluut niet</span><span style="--c:#F6C343">speciale week</span><span style="--c:#8EC5EC">schoolvakantie</span><span style="--c:#7B4BB7">feestdag</span></div>';
  m.appendChild(u);
  var bv = el('details','blok uitleg'); bv.innerHTML = '<summary>🔒 Beveiliging &amp; gegevens</summary><ul>' +
    '<li>Je gegevens staan <b>enkel in een afgeschermd Google-blad</b> in de Google Drive van de beheerder (dr. Govaers). Dat account is beveiligd met <b>tweestapsverificatie</b> en het blad is met niemand gedeeld.</li>' +
    '<li>Deze pagina <b>bewaart zelf niets</b>. Ze haalt alleen jouw gegevens op via een <b>versleutelde verbinding (https)</b>.</li>' +
    '<li>Jij ziet enkel <b>je eigen</b> keuzes. Collega\'s zien jouw keuzes niet, enkel een <b>telling per week zonder namen</b> (👥).</li>' +
    '<li>Je link bevat een <b>persoonlijke code van 24 tekens</b>, die niet te raden is. <b>Stuur je link niet door</b>: wie hem heeft, kan jouw voorkeuren wijzigen.</li>' +
    '<li>Na <b>20 foute codes per uur</b> blokkeert het invulscherm tijdelijk en krijgt de beheerder een melding.</li>' +
    '<li>Link kwijt? "Stuur mijn link" mailt <b>enkel naar jouw adres in de stafledenlijst</b>, maximaal 3 keer per dag.</li>' +
    '<li>De gegevens worden <b>enkel gebruikt voor de wachtplanning</b> van de MKA-groep.</li></ul>';
  m.appendChild(bv);
  var s = el('div','blok schakel');
  s.appendChild(el('span','', 'Wil je soms 2 weken na elkaar wacht doen?'));
  var sel = el('select'); sel.innerHTML = '<option value="nee">Nee</option><option value="ja">Ja (max. 2)</option>';
  sel.value = (tweeW===null ? D.tweeWeken : tweeW) ? 'ja' : 'nee';
  sel.onchange = function(){ tweeW = sel.value==='ja'; plan(); };
  s.appendChild(sel); m.appendChild(s);
  var s2 = el('div','blok schakel'); s2.style.flexWrap='wrap';
  s2.appendChild(el('span','', '♥ Hoeveel van je ' + (D.wps||5) + ' wachten mag de tool in je ♥-weken leggen?'));
  var sel2 = el('select'), opt = '<option value="0">–</option>';
  for (var gi=1; gi<=(D.wps||5); gi++) opt += '<option value="'+gi+'">'+gi+'</option>';
  sel2.innerHTML = opt; sel2.value = String(gmaxNu(j.nr));
  sel2.onchange = function(){ gmaxW = {nr:j.nr, n:Number(sel2.value)}; plan(); voet(); };
  s2.appendChild(sel2);
  s2.appendChild(el('div','tipgr', 'Enkel nodig als je ♥-weken aanduidt. Je doet altijd ' + (D.wps||5) + ' wachten; de rest verdeelt de tool over het jaar. Geldt enkel voor wachtjaar ' + j.nr + '.'));
  m.appendChild(s2);

  var vorigeMaand = '';
  j.weken.forEach(function(w){
    var mk = w.ma.slice(0,7);
    if (mk !== vorigeMaand){ vorigeMaand = mk; m.appendChild(el('div','maand', MAAND[+mk.slice(5,7)-1] + ' ' + mk.slice(0,4))); }
    if (w.soort !== 'WACHT'){
      m.appendChild(el('div','apart', 'wk ' + w.wk + ' · ' + (w.soort==='KERST'?'🎄 Kerstwacht':'🎆 Nieuwjaarswacht') + ' – aparte regeling, hier niets in te vullen'));
      return;
    }
    m.appendChild(weekKaart(w));
  });
  voet();
}

function weekKaart(w){
  var st = weekStatus(w);
  var k = el('div','week' + (st==='O'?' st-o':st==='R'?' st-r':st==='P'?' st-p':'') + (w.sp?' sp':''));
  k.id = 'w-' + w.k;
  var h = el('div','wkop');
  var nr = el('button','wknr','wk ' + w.wk);
  nr.setAttribute('aria-label','Hele week ' + w.wk + ' aanduiden');
  nr.onclick = function(){ if (vastJaar()) return; w.dagen.forEach(function(x){ zet(x.d, penseel); }); herteken(w); };
  h.appendChild(nr);
  h.appendChild(el('span','tijd', w.van + ' → ' + w.tot));
  if (w.sp) h.appendChild(el('span','chip sp','⭐ ' + w.sp));
  if (w.zomer) h.appendChild(el('span','chip zo','☀ zomer'));
  if (st==='P') h.appendChild(el('span','chip gr','♥ graag'));
  var t = D.tellers[w.k];
  if (t){ var c = el('span','chip tel'); c.id = 't-' + w.k; c.title='Aantal collega\'s zonder ✕ in deze week (jij inbegrepen)'; zetTeller(c, t); h.appendChild(c); }
  k.appendChild(h);
  var g = el('div','dagen');
  var feest = [];
  w.dagen.forEach(function(x){
    var y = v(x.d);
    var d = el('div','dag ' + (y==='O'?'o':y==='R'?'r':y==='P'?'p':'') + (x.we?' we':'') + (x.v?' v':'') + (x.f?' f':''));
    d.setAttribute('role','button');
    d.title = x.d + (x.f ? ' · ' + x.f : '') + (x.v ? ' · ' + x.v : '');
    d.appendChild(el('div','l', x.l)); d.appendChild(el('div','n', x.n + '/' + x.m)); d.appendChild(el('div','s', SYM[y]));
    d.onclick = function(){ if (vastJaar()) return; zet(x.d, v(x.d)===penseel && penseel!=='G' ? 'G' : penseel); herteken(w); };
    g.appendChild(d);
    if (x.f) feest.push(x.l + ' ' + x.n + '/' + x.m + ': ' + x.f);
  });
  k.appendChild(g);
  if (feest.length) k.appendChild(el('div','feestnaam','● ' + feest.join(' · ')));
  var o = el('div','opm');
  var huidig = (w.k in opmW) ? opmW[w.k] : (D.opm[w.k] || '');
  if (vastJaar()){ if (huidig) o.appendChild(el('span','tijd','💬 ' + huidig)); }
  else if (huidig){ o.appendChild(invoer(w, huidig)); }
  else { var b = el('button','', '💬 opmerking toevoegen'); b.onclick = function(){ o.textContent=''; var i=invoer(w,''); o.appendChild(i); i.focus(); }; o.appendChild(b); }
  k.appendChild(o);
  return k;
}
function invoer(w, waarde){
  var i = el('input'); i.type='text'; i.maxLength=200; i.placeholder='bv. congres, enkel weekend lukt niet'; i.value=waarde;
  i.oninput = function(){ opmW[w.k] = i.value; D.opm[w.k] = i.value; plan(); };
  return i;
}
function vastJaar(){ return jaarIdx === -1 || !!D.jaren[jaarIdx].vast; }
function zetTeller(c, t){ c.textContent = '👥 ' + t[0] + '/' + t[1] + ' kunnen'; c.className = 'chip tel' + (t[0] <= 3 ? ' krap' : ''); }
function tellersBijwerken(){ Object.keys(D.tellers).forEach(function(k){ var c=document.getElementById('t-'+k); if(c) zetTeller(c, D.tellers[k]); }); }
function zet(d, nieuw){ if (nieuw==='G') delete D.voorkeur[d]; else D.voorkeur[d]=nieuw; wijz[d]=nieuw; plan(); }
function herteken(w){ var oud=document.getElementById('w-'+w.k); oud.parentNode.replaceChild(weekKaart(w), oud); voet(); }

function voet(){
  if (jaarIdx === -1){ document.getElementById('voet').textContent = 'Vragen? Antwoord op een mail van Wachtplanning MKA.'; return; }
  var graag=0, j = D.jaren[jaarIdx], rood=0, oranje=0, spR=0, spT=0, zoR=0, zoT=0, roodDagen=0;
  j.weken.forEach(function(w){ if (w.soort!=='WACHT') return; var s=weekStatus(w);
    if (s==='R') rood++; else if (s==='O') oranje++; else if (s==='P') graag++;
    if (w.sp){ spT++; if (s==='R') spR++; } if (w.zomer){ zoT++; if (s==='R') zoR++; } });
  Object.keys(D.voorkeur).forEach(function(d){ if (D.voorkeur[d]==='R') roodDagen++; });
  var f = document.getElementById('voet'); f.textContent='';
  function wk(n){ return n + (n===1 ? ' week' : ' weken'); }
  f.appendChild(el('div','', 'Wachtjaar ' + j.nr + ':  ' + (graag ? '♥ ' + wk(graag) + ' graag  ·  ' : '') + '✕ ' + wk(rood) + ' geblokkeerd  ·  ~ ' + wk(oranje) + ' liever niet'));
  var w = [];
  if (D.drempel && rood >= D.drempel) w.push('Je blokkeert veel weken (' + rood + '). Kan je enkele ✕ vervangen door ~? Zo blijft een eerlijke planning mogelijk.');
  if (spT && spR === spT) w.push('Je blokkeert alle speciale weken – iedereen moet er één doen.');
  if (zoT && zoR === zoT) w.push('Je blokkeert alle zomerweken.');
  if (D.maxRood && roodDagen > D.maxRood) w.push('Meer dan ' + D.maxRood + ' dagen ✕ aangeduid (maximum).');
  if (graag && !gmaxNu(j.nr)) w.push('Je duidde ♥-weken aan. Kies bovenaan hoeveel van je wachten de tool erin mag leggen (nu: max. 2).');
  w.forEach(function(t){ f.appendChild(el('div','w','⚠ ' + t)); });
  if (j.vast) return;
  if (D.klaar){
    f.appendChild(el('div','klaarok','✔ Klaar op ' + D.klaar.slice(0,10) + ' – je kunt nog wijzigen tot de planning vastligt.'));
  } else {
    var kb = el('button','klaarknop','✔ Ik ben klaar met invullen');
    kb.onclick = function(){
      if (teBewaren() || bezig){ nuOfStraks(); }
      kb.disabled = true; kb.textContent = 'Even geduld…';
      stuur({actie:'klaar', k:D.code}, function(r){ D.klaar = (r && r.klaar) || 'vandaag'; voet(); },
        function(){ kb.disabled = false; kb.textContent = '✔ Ik ben klaar met invullen'; status('⚠ niet gelukt – probeer opnieuw', true); });
    };
    f.appendChild(kb);
  }
}
function nuOfStraks(){ clearTimeout(timer); bewaar(); }

var traagTimer = null, volgnr = 0, SESSIE = Math.random().toString(36).slice(2, 12);
/* soort: 'ok' (groen), 'bezig' (oranje), 'fout' (rood) */
function status(t, soort){
  var s=document.getElementById('status'); s.textContent=t; s.className = soort===true ? 'fout' : (soort||'');
  var tr=document.getElementById('traag');
  if (soort==='bezig'){ if(!traagTimer) traagTimer=setTimeout(function(){ tr.style.display='block'; }, 5000); }
  else { clearTimeout(traagTimer); traagTimer=null; tr.style.display='none'; }
}
function teBewaren(){ return Object.keys(wijz).length || Object.keys(opmW).length || tweeW!==null || gmaxW!==null; }
function plan(){ status('⏳ bewaren…','bezig'); clearTimeout(timer); timer = setTimeout(bewaar, 600); }
function bewaar(){
  if (bezig){ plan(); return; }
  var a = wijz, b = opmW, c = tweeW, g = gmaxW; wijz = {}; opmW = {};
  if (!Object.keys(a).length && !Object.keys(b).length && c===null && g===null){ status('✓ alles bewaard','ok'); return; }
  bezig = true;
  stuur({actie:'bewaar', k:D.code, wijz:a, opm:b, tweeWeken:c, graagMax:g, s:SESSIE, n:++volgnr}, function(r){
    bezig = false; if (c!==null){ D.tweeWeken = c; if (tweeW===c) tweeW = null; }
    if (g!==null){ D.graagMax = D.graagMax||{}; D.graagMax[g.nr] = g.n; if (gmaxW===g) gmaxW = null; }
    if (r && r.tellers){ D.tellers = r.tellers; tellersBijwerken(); }
    if (teBewaren()) status('⏳ bewaren…','bezig'); else status('✓ bewaard ' + r.tijd,'ok');
  }, function(e){
    bezig = false;
    Object.keys(a).forEach(function(k){ if(!(k in wijz)) wijz[k]=a[k]; });
    Object.keys(b).forEach(function(k){ if(!(k in opmW)) opmW[k]=b[k]; });
    status('⚠ niet bewaard – nieuwe poging…', true); clearTimeout(timer); timer = setTimeout(bewaar, 5000);
  });
}
/* Pagina wordt gesloten of de gsm schakelt naar een andere app: wat nog niet verstuurd is, meteen versturen.
   sendBeacon wordt door de browser afgeleverd, ook nadat de pagina dicht is. */
function nuVersturen(){
  if (!D || !teBewaren() || (window.google && google.script && google.script.run) || !navigator.sendBeacon) return;
  var p = JSON.stringify({actie:'bewaar', k:D.code, wijz:wijz, opm:opmW, tweeWeken:tweeW, graagMax:gmaxW, s:SESSIE, n:++volgnr});
  if (navigator.sendBeacon(API, new Blob([p], {type:'text/plain'}))){ wijz = {}; opmW = {}; if (tweeW!==null){ D.tweeWeken = tweeW; tweeW = null; } if (gmaxW!==null){ D.graagMax = D.graagMax||{}; D.graagMax[gmaxW.nr] = gmaxW.n; gmaxW = null; } clearTimeout(timer); if (!bezig) status('✓ bewaard','ok'); }
}
document.addEventListener('visibilitychange', function(){ if (document.visibilityState==='hidden') nuVersturen(); });
window.addEventListener('pagehide', nuVersturen);
window.addEventListener('beforeunload', function(e){ nuVersturen(); if (teBewaren() || bezig){ e.preventDefault(); e.returnValue=''; } });
document.querySelectorAll('.penseel button').forEach(function(b){
  b.onclick = function(){ penseel = b.getAttribute('data-v');
    document.querySelectorAll('.penseel button').forEach(function(x){ x.classList.toggle('actief', x===b); }); };
});
/* ---- transport: binnen Google (google.script.run) of als aparte pagina (fetch naar de web-app) ---- */
var API = 'https://script.google.com/macros/s/AKfycbzI4y9c5zt3PMUZkYFP-3d9lsGZjawwgm7Ilk48nQgsBjwE8KVsy-9RJJOV3usYRo7d/exec';
function stuur(payload, ok, fout){
  if (window.google && google.script && google.script.run){
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fout);
    if (payload.actie === 'bewaar') r.bewaarVoorkeuren(payload.k, payload.wijz, payload.opm, payload.tweeWeken, null, null, payload.graagMax);
    else if (payload.actie === 'klaar') r.zetKlaar(payload.k);
    else if (payload.actie === 'wissel') r.wisselActie(payload);
    else r.stuurLinkOpnieuw(payload.email);
    return;
  }
  // keepalive: de aanvraag loopt door, ook als de pagina intussen gesloten wordt.
  // Bewaren: geen antwoord na 4 en 9 sec. → dezelfde vraag opnieuw (de server voert elke bewaring maar één keer uit, dankzij s + n).
  var klaar = false, gestuurd = 0, mis = 0, laatsteFout = null, timers = [];
  function een(){ gestuurd++;
    fetch(API, {method:'POST', body: JSON.stringify(payload), keepalive: true}).then(function(x){ return x.json(); })
      .then(function(r){ if (klaar) return; if (r && r.fout){ klaar = true; timers.forEach(clearTimeout); fout(r.fout); } else { klaar = true; timers.forEach(clearTimeout); ok(r); } })
      .catch(function(e){ laatsteFout = e; if (++mis >= 3 && !klaar){ klaar = true; fout(e); } });
  }
  een();
  if (payload.actie === 'bewaar'){ timers.push(setTimeout(function(){ if(!klaar) een(); }, 4000)); timers.push(setTimeout(function(){ if(!klaar) een(); }, 9000)); }
  else mis = 2;
}
/* ================= Mijn wachten & wisselen (fase 6b) ================= */
var M = null, mMelding = '', mFout = false;
function wissel(sub, extra, ok){
  var p = Object.assign({actie:'wissel', sub:sub, k:D.code}, extra||{});
  status('⏳ even geduld…','bezig');
  stuur(p, function(r){ status('✓ klaar','ok'); if (r && r.mijn) M = r.mijn; mMelding = (r && r.melding) || ''; mFout = false; if (ok) ok(r); else tekenMijn(); },
    function(e){ status('⚠ niet gelukt', true); mMelding = (e && e.message) || String(e || 'Er ging iets mis.'); mFout = true; tekenMijn(); });
}
function tekenMijn(){
  var pz = document.querySelector('.penseel'); if (pz) pz.style.display='none';
  var m = document.getElementById('main'); m.textContent=''; m.className='mw';
  if (!M){ m.appendChild(el('div','blok','Je wachten worden geladen…')); wissel('lijst'); voet(); return; }
  if (mMelding){ m.appendChild(el('div','melding' + (mFout?' fout':''), mMelding)); }
  var u = el('details','blok uitleg'); u.innerHTML = '<summary>⇄ Hoe wisselen? (30 sec.)</summary><ol style="margin:6px 0 0;padding-left:18px;color:#5B6675">' +
    '<li>Tik bij je wacht op <b>⇄ Wissel aanvragen</b> en vink aan welke collega\'s je vraag krijgen (🟢 kon die week · 🟠 liever niet · 🔴 kon niet).</li>' +
    '<li>Je collega kiest welke van zijn wachten hij in ruil aanbiedt – soms meerdere.</li>' +
    '<li>Jij krijgt een mail, kiest één aanbod en tikt <b>Bevestig ruil</b>. Klaar: jullie krijgen allebei een nieuwe lijst en agenda-bestand.</li>' +
    '<li>⚠ Breekt een ruil een regel (bv. 2 weken na elkaar)? Dan zie je dat vooraf en beslis je zelf.</li>' +
    '<li>Ruilen kan enkel even groot en van hetzelfde soort: week ⇄ week, Kerst/Nieuwjaar ⇄ Kerst/Nieuwjaar' + (M.dagruil ? ', nacht ⇄ nacht, weekend-/feestdag ⇄ weekend-/feestdag' : '') + '. Een vraag vervalt na 14 dagen.</li></ol>';
  m.appendChild(u);
  // vragen aan mij
  if (M.inn.length){
    m.appendChild(el('h3','', '📨 Vragen aan jou'));
    M.inn.forEach(function(v){ m.appendChild(kaartIn(v)); });
  }
  if (M.uit.length){
    m.appendChild(el('h3','', '📤 Jouw wisselvragen'));
    M.uit.forEach(function(v){ m.appendChild(kaartUit(v)); });
  }
  m.appendChild(el('h3','', '📋 Mijn wachten'));
  if (!M.momenten.length) m.appendChild(el('div','blok','Je hebt geen komende wachten.'));
  M.momenten.forEach(function(mo){ m.appendChild(kaartMoment(mo)); });
  voet();
}
var SYMN = ['🟢 kon die week','🟠 liever niet','🔴 kon NIET'];
function kaartIn(v){
  var k = el('div','kaart vraag');
  k.appendChild(el('div','t', v.van + ' vraagt: ' + v.label));
  k.appendChild(el('div','sub', v.tijd + ' · jij: ' + ['✓ ja ik kan','~ liever niet','✕ absoluut niet'][v.mijnNiveau] + ' · vervalt ' + v.vervalt.split('-').reverse().join('/')));
  if (v.boodschap) k.appendChild(el('div','sub','💬 "' + v.boodschap + '"'));
  if (v.antwoord) k.appendChild(el('div','sub', v.antwoord.nee ? '➜ Je antwoordde: kan niet (je mag nog aanbieden).' : '➜ Je bood al aan – je mag je aanbod aanpassen.'));
  var l = el('div','lijst');
  if (!v.opties.length) l.appendChild(el('div','sub','Je hebt geen passende wacht om in ruil te geven.'));
  v.opties.forEach(function(o){
    var lab = el('label'); var c = el('input'); c.type='checkbox'; c.value=o.key;
    if (v.antwoord && v.antwoord.keys && v.antwoord.keys.indexOf(o.key)>=0) c.checked = true;
    lab.appendChild(c); var tx = el('span'); tx.appendChild(el('b','', o.label)); tx.appendChild(el('span','sub',' · ' + o.tijd));
    if (o.niveauA===0) tx.appendChild(el('span','w8','🟢 ' + v.van.split(' ')[0] + ' kon die week'));
    o.waarsch.forEach(function(w){ tx.appendChild(el('span','w8', w)); });
    lab.appendChild(tx); l.appendChild(lab);
  });
  k.appendChild(l);
  var kn = el('div','knoppen');
  var a = el('button','k hoofd','Aanbieden'); a.disabled = !v.opties.length;
  a.onclick = function(){ var keys = [].slice.call(l.querySelectorAll('input:checked')).map(function(x){ return x.value; });
    if (!keys.length){ mMelding='Vink minstens één van je wachten aan.'; mFout=true; tekenMijn(); return; }
    a.disabled=true; wissel('aanbod', {id:v.id, keys:keys}); };
  var n = el('button','k nee','Ik kan niet'); n.onclick = function(){ n.disabled=true; wissel('aanbod', {id:v.id, nee:true}); };
  kn.appendChild(a); kn.appendChild(n); k.appendChild(kn);
  return k;
}
function kaartUit(v){
  var k = el('div','kaart uit');
  k.appendChild(el('div','t', 'Jij vraagt: ' + v.label));
  k.appendChild(el('div','sub', v.tijd + ' · gevraagd aan ' + v.aan.join(', ') + ' · vervalt ' + v.vervalt.split('-').reverse().join('/')));
  var l = el('div','lijst'), kanKiezen = false;
  if (!v.antwoorden.length) l.appendChild(el('div','sub','⏳ Nog geen antwoord.'));
  v.antwoorden.forEach(function(a){
    if (a.nee){ l.appendChild(el('div','sub','✖ ' + a.naam + ': kan niet')); return; }
    a.opties.forEach(function(o){
      kanKiezen = true;
      var lab = el('label'); var r = el('input'); r.type='radio'; r.name='kies-'+v.id; r.value = a.b + '§' + o.key;
      lab.appendChild(r); var tx = el('span'); tx.appendChild(el('b','', a.naam + ' geeft ' + o.label)); tx.appendChild(el('span','sub',' · ' + o.tijd));
      o.waarsch.forEach(function(w){ tx.appendChild(el('span','w8', w)); });
      lab.appendChild(tx); l.appendChild(lab);
    });
  });
  k.appendChild(l);
  var kn = el('div','knoppen');
  if (kanKiezen){
    var b = el('button','k hoofd','✔ Bevestig ruil');
    b.onclick = function(){ var r = l.querySelector('input:checked');
      if (!r){ mMelding='Kies eerst één aanbod.'; mFout=true; tekenMijn(); return; }
      var w8 = r.parentNode.querySelectorAll('.w8').length;
      if (w8 && b.textContent.indexOf('toch')<0){ b.textContent='⚠ Ik heb de waarschuwing gelezen – toch ruilen'; return; }
      var p = r.value.split('§'); b.disabled=true; wissel('kies', {id:v.id, b:p[0], key:p[1]}); };
    kn.appendChild(b);
  }
  var x = el('button','k nee','Vraag intrekken'); x.onclick = function(){ x.disabled=true; wissel('annuleer', {id:v.id}); };
  kn.appendChild(x); k.appendChild(kn);
  return k;
}
function kaartMoment(mo){
  var k = el('div','kaart');
  k.appendChild(el('div','t', mo.label)); k.appendChild(el('div','sub', mo.tijd + (mo.later ? ' · (later wachtjaar)' : '')));
  var kn = el('div','knoppen'), paneel = el('div');
  mo.keys.forEach(function(ky){
    if (ky.open){ kn.appendChild(el('span','sub','⏳ wisselvraag loopt (' + ky.label + ')')); return; }
    var b = el('button','k', ky.label === 'hele week' ? '⇄ Wissel aanvragen' : '⇄ ' + ky.label);
    b.onclick = function(){ paneel.textContent=''; paneel.appendChild(el('div','sub','Collega\'s worden gezocht…'));
      wissel('kand', {key:ky.key}, function(r){ toonKandidaten(paneel, ky, r.kandidaten || []); }); };
    kn.appendChild(b);
  });
  k.appendChild(kn); k.appendChild(paneel);
  return k;
}
function toonKandidaten(p, ky, lijst){
  p.textContent='';
  p.appendChild(el('div','sub','Wie krijgt je vraag? (' + (ky.label==='hele week' ? 'hele week' : ky.label) + ')'));
  var l = el('div','lijst');
  lijst.forEach(function(c){
    var lab = el('label', c.kanRuilen ? '' : 'uit'); var x = el('input'); x.type='checkbox'; x.value=c.id; x.disabled = !c.kanRuilen;
    lab.appendChild(x); lab.appendChild(el('span','bol')); lab.lastChild.style.background = ['#1E8E4E','#F0A030','#C62828'][c.niveau];
    var tx = el('span'); tx.appendChild(el('b','', c.naam)); tx.appendChild(el('span','sub',' · ' + (c.graag ? '♥ wil die week graag' : SYMN[c.niveau])));
    if (!c.kanRuilen) tx.appendChild(el('span','w8','geen passende wacht om terug te geven'));
    c.waarsch.forEach(function(w){ tx.appendChild(el('span','w8', w)); });
    lab.appendChild(tx); l.appendChild(lab);
  });
  p.appendChild(l);
  var t = el('textarea'); t.rows=2; t.maxLength=300; t.placeholder='Korte boodschap (optioneel), bv. "congres in Gent"'; p.appendChild(t);
  var kn = el('div','knoppen'), b = el('button','k hoofd','Verstuur vraag');
  b.onclick = function(){ var aan = [].slice.call(l.querySelectorAll('input:checked')).map(function(x){ return x.value; });
    if (!aan.length){ b.textContent='Vink minstens één collega aan'; return; }
    b.disabled=true; wissel('vraag', {key:ky.key, aan:aan, boodschap:t.value}); };
  var a = el('button','k','Annuleren'); a.onclick = function(){ p.textContent=''; };
  kn.appendChild(b); kn.appendChild(a); p.appendChild(kn);
}
function linkScherm(tekst){
  document.querySelector('header').style.display='none';
  var m = document.getElementById('main'); m.innerHTML =
    '<div class="blok" style="margin-top:30px"><b style="font-size:18px">🩺 Wachtplanning MKA</b><p style="color:#5B6675">' + tekst + '</p>' +
    '<input id="em" type="email" autocomplete="email" placeholder="voornaam.naam@zas.be" style="width:100%;font-size:16px;padding:11px;border:1px solid #C9D0D8;border-radius:10px;margin:6px 0">' +
    '<button id="bt" style="width:100%;font-size:16px;padding:12px;border:none;border-radius:10px;background:#1F3A5F;color:#fff;font-weight:600">Stuur mijn link</button><p id="ms" style="font-weight:600;color:#1E8E4E"></p></div>';
  document.getElementById('bt').onclick = function(){ var b=this; b.disabled=true; b.textContent='Even geduld…';
    stuur({actie:'link', email:document.getElementById('em').value}, function(r){ document.getElementById('ms').textContent = (r && r.tekst) || r; b.textContent='Verstuurd'; },
      function(){ document.getElementById('ms').textContent='Er ging iets mis. Probeer later opnieuw.'; b.disabled=false; b.textContent='Stuur mijn link'; }); };
}
function start(){
  if (D){ if (heeftVast()) jaarIdx = -1; kop(); teken(); return; }
  var k = new URLSearchParams(location.search).get('k');
  if (!k){ linkScherm('Open deze pagina via je persoonlijke link uit de mail. Link kwijt? Vul je e-mailadres in.'); return; }
  laden(k);
}
function laden(k){
  var hdr=document.querySelector('header'); hdr.style.display='none';
  var m=document.getElementById('main');
  m.innerHTML = '<div class="blok laden"><div class="spin"></div><b style="font-size:17px">Je gegevens worden geladen…</b>' +
    '<div class="na" id="na">Dit kan soms tot <b>30 seconden</b> duren. Even geduld, sluit de pagina niet.</div></div>';
  var t1=setTimeout(function(){ var n=document.getElementById('na'); if(n) n.style.display='block'; }, 3000);
  var klaar=false;
  var t2=setTimeout(function(){ if(!klaar){ klaar=true; mislukt(); } }, 60000);
  function mislukt(){ clearTimeout(t1);
    m.innerHTML = '<div class="blok laden">⚠ <b>De gegevens konden niet geladen worden.</b><p style="color:#5B6675">Controleer je internetverbinding en probeer opnieuw.</p><button class="knop" id="opnieuw">Opnieuw proberen</button></div>';
    document.getElementById('opnieuw').onclick=function(){ laden(k); }; }
  // Google antwoordt soms traag (een nieuwe "server" die opstart). Daarom: geen antwoord na 3 en 7 sec.
  // → dezelfde vraag nog eens sturen; het eerste antwoord telt. (Ophalen verandert niets, dus dit is veilig.)
  var fouten=0, pogingen=0;
  function vraag(){ pogingen++;
    fetch(API + '?api=data&k=' + encodeURIComponent(k) + '&p=' + pogingen).then(function(x){ return x.json(); }).then(ontvangen)
      .catch(function(){ if (++fouten >= pogingen && !klaar && pogingen >= 3){ klaar=true; clearTimeout(t2); mislukt(); } });
  }
  var h1=setTimeout(function(){ if(!klaar) vraag(); }, 3000), h2=setTimeout(function(){ if(!klaar) vraag(); }, 7000);
  vraag();
  function ontvangen(r){
    if (klaar) return; klaar=true; clearTimeout(t1); clearTimeout(t2); clearTimeout(h1); clearTimeout(h2);
    if (!r || r.fout){ linkScherm(r && /Te veel/.test(r.fout) ? r.fout : 'Deze link is niet (meer) geldig. Vul je e-mailadres in, dan sturen we je persoonlijke link opnieuw.'); return; }
    hdr.style.display=''; D = r; if (heeftVast()) jaarIdx = -1; kop(); teken();
  }
}
start();
